name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  nucleo:
    name: núcleo Rust
      # ubuntu-24.04 y no 22.04, y la razón es concreta: se usa
      # `stream.capture.sink` para el loopback, y esa propiedad apareció en
      # PipeWire 0.3.53. Ubuntu 22.04 trae 0.3.48, así que las cabeceras no la
      # tienen y `core/audio-capture` ni siquiera compila.
      #
      # El precio es el glibc: un binario compilado aquí exige 2.39 o superior,
      # o sea Ubuntu 24.04+ y equivalentes. Se acepta a conciencia: la
      # alternativa sería renunciar a la captura de la salida del sistema, que
      # es justo la función principal.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # `libclang-dev` es imprescindible y fácil de olvidar: `bindgen`, que usan
      # tanto `pipewire-sys` como `whisper-rs-sys`, lo necesita en tiempo de
      # compilación. El metapaquete `clang` lo arrastra como *recomendado*, y
      # con `--no-install-recommends` no llega — que es exactamente cómo falló
      # la primera ejecución de este workflow.
      #
      # No se instala libssl-dev: el proyecto usa rustls.
      - name: dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config \
            libpipewire-0.3-dev libasound2-dev libsecret-1-dev

      - name: versiones
        run: |
          rustc --version && cargo --version
          cmake --version | head -1
          clang --version | head -1
          pkg-config --modversion libpipewire-0.3

      # Pasos separados para que el fallo diga cuál de los tres fue.
      - name: formato
        run: cargo fmt --all -- --check

      - name: compilar
        run: cargo build --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace
        env:
          RUST_BACKTRACE: 1

  nucleo-windows:
    name: núcleo Rust (Windows)
    runs-on: windows-latest
    # Este job nació de un fallo real: `core/api` llevaba tiempo sin compilar
    # en Windows (usaba `dictar_audio::reproductor`, que está tras
    # `cfg(target_os = "linux")`) y el CI daba verde porque `nucleo` solo
    # corre en `ubuntu-24.04`. Aquí se comprueba que el workspace compila
    # multiplataforma; no se repiten fmt/clippy, que ya corren arriba, en
    # Linux. `test` sí se añadió (ver más abajo el paso de `dictar-audio`):
    # no es una repetición, es lo único que ejercita de verdad el código
    # gateado a `cfg(windows)` de `wasapi_src.rs`, que en el job de Linux ni
    # siquiera se compila.
    env:
      # LLVM viene preinstalado en los runners de Windows de GitHub, pero
      # nada apunta a él por defecto. `whisper-rs-sys` genera sus bindings
      # con bindgen, que busca libclang.dll a través de esta variable; sin
      # ella el build.rs falla antes de compilar una sola línea Rust. CMake y
      # el enlazador de MSVC, que ese mismo build.rs necesita para compilar
      # whisper.cpp, ya vienen instalados en el runner.
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Nada que instalar aquí: pipewire y libspa solo son dependencias bajo
      # cfg(target_os = "linux") (ver core/audio-capture/Cargo.toml), así que
      # en Windows Cargo ni siquiera las descarga.

      # cargo check para todo el workspace, no build ni test. El build.rs de
      # whisper-rs-sys compila whisper.cpp con CMake da igual el modo, así
      # que esa parte no se evita; lo que sí evita `check` es generar código
      # y enlazar todos los binarios y tests del workspace (`--all-targets`
      # incluye el CLI y los tests de cada crate) y repetir aquí la batería
      # completa de `cargo test`, que ya corre en el job de Linux. Basta
      # para cazar rupturas de compilación multiplataforma sin pagar ese
      # coste dos veces en cada PR. El paso siguiente sí ejecuta tests, pero
      # solo los de `dictar-audio`: ver su comentario.
      - name: comprobar compilación
        run: cargo check --workspace --all-targets

      # Solo `dictar-audio`, no todo el workspace: repetir aquí los tests de
      # `cli`, `core/stt`, etc. duplicaría el coste que este job existe
      # justamente para evitar (ver el comentario de más arriba), sin cubrir
      # nada nuevo — esos crates no tienen código gateado a Windows.
      - name: tests de dictar-audio
        run: cargo test -p dictar-audio
        env:
          RUST_BACKTRACE: 1

  android:
    name: núcleo y APK de Android
    runs-on: ubuntu-24.04
    # Este job existe por dos fallos distintos, y conviene no confundirlos:
    #
    # 1. El núcleo tenía que cruzar a Android y nadie lo había ejecutado
    #    nunca: `cargo ndk build -p dictar-api` no se había corrido ni una
    #    vez (era el bloqueo B-3 del tablero). Una rama `cfg(target_os =
    #    "android")` que no compile no se ve en ningún otro job.
    #
    # 2. **El chequeo de que el paquete lleva el núcleo dentro solo vivía en
    #    `release.yml`**, que dispara con `tags: v*`. El fallo más silencioso
    #    que ha tenido este proyecto —APK sin `libdictar_api.so`, aplicación
    #    que cae en su `catch` y arranca con datos de demostración, y parece
    #    funcionar— no se veía en el PR que lo reintroducía, sino al cortar
    #    una release. Aquí se comprueba en cada PR.
    env:
      LIBCLANG_PATH: /usr/lib/llvm-18/lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # El objetivo de los teléfonos en uso. `armeabi-v7a` se puede pedir
          # a mano (`-Pabis=...` en Gradle), pero no se compila en cada PR:
          # duplicaría el tiempo del job para cubrir hardware residual.
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # `bindgen` (vía whisper-rs-sys) necesita libclang también aquí, y
      # cmake compila whisper.cpp cruzado con la cadena del NDK.
      - name: dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # Los runners de Ubuntu traen el NDK preinstalado, pero nada apunta a
      # él: `cargo ndk` lo busca por esta variable y sin ella falla diciendo
      # que no encuentra el NDK, que suena a que no está instalado.
      - name: apuntar al NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Paso propio, antes del APK, para que el fallo diga si fue el núcleo o
      # el empaquetado. Es el criterio 2 de HU-12.
      - name: cruzar el núcleo a Android
        run: cargo ndk -t arm64-v8a build --release -p dictar-api

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: app

      - name: construir el APK
        run: flutter build apk --release
        working-directory: app

      # La compuerta de verdad. `flutter build apk` puede terminar en verde
      # con un APK sin la librería nativa dentro: eso es exactamente lo que
      # pasó, y la aplicación arrancaba con datos de demostración sin avisar.
      # Se mira dentro del .apk, que es un zip, en vez de fiarse de que la
      # tarea de Gradle corriera.
      - name: el APK lleva el núcleo dentro
        working-directory: app
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/libdictar_api.so'; then
            echo "::error::el APK no lleva libdictar_api.so: la aplicación arrancaría con datos de demostración"
            unzip -l "$apk" | grep 'lib/' || echo "(no hay ninguna librería nativa)"
            exit 1
          fi
          echo "libdictar_api.so está dentro del APK"

  app:
    name: análisis de Flutter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app
