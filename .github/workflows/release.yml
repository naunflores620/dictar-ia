name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# La matriz compila cada plataforma en su propio runner: Flutter necesita el
# MSVC y el SDK de Windows para el .exe, y no hay cross-compile fiable desde
# Linux.
#
# Aviso honesto sobre lo que sale de aquí: el .exe de Windows y el APK de
# Android se construyen y llevan el núcleo dentro, pero **todavía no pueden
# grabar**. La captura de audio solo está implementada para PipeWire
# (core/audio-capture/src/lib.rs: `iniciar()` devuelve `NoSoportada` fuera de
# Linux). Falta WASAPI *loopback* en Windows y AAudio en Android. Todo lo demás
# —transcribir un audio importado, generar apuntes, consultar el historial— sí
# funciona en las tres.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            plataforma: linux
          - os: windows-latest
            plataforma: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      # En Windows no se cachea `target/`, solo el registro de cargo.
      # `sherpa-onnx-sys` descarga las librerías precompiladas de Sherpa a
      # `target/release/sherpa-onnx-prebuilt` desde su build.rs. Con `target/`
      # restaurado, el enlazado falla con LNK1181 («cannot open input file
      # 'sherpa-onnx-c-api.lib'») aunque se limpie ese crate con `cargo clean`:
      # se probó y no bastó. La única ejecución que pasó fue la que no tenía
      # caché, así que en Windows el núcleo se compila siempre limpio. Linux
      # funciona con caché y se deja como estaba.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: ${{ matrix.plataforma != 'windows' }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: dependencias del sistema (Linux)
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config \
            libgtk-3-dev liblzma-dev \
            libpipewire-0.3-dev libasound2-dev libsecret-1-dev \
            libdbus-1-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev

      # El equivalente en Windows de instalar `libclang-dev`: LLVM ya viene en
      # el runner, pero nada apunta a él, y `whisper-rs-sys` genera sus
      # bindings con bindgen, que busca libclang.dll por esta variable. Sin
      # ella el build.rs falla antes de compilar una sola línea de Rust. CMake
      # y MSVC, que ese mismo build.rs necesita para whisper.cpp, ya están.
      # Y junto a eso, el toolchain que dice cómo compilar whisper.cpp con
      # MSVC. Sin él el paquete se genera igual y arranca igual, pero con
      # whisper sin AVX2 y sin `/O2` —el crate `cmake` pisa los flags de
      # release por defecto de CMake—, lo que multiplica por once el tiempo de
      # transcripción: medido, 368 s contra 32 s sobre el mismo audio. Es la
      # clase de defecto que ningún test caza porque todo pasa en verde.
      - name: dependencias del sistema (Windows)
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\packaging\windows\msvc-toolchain.cmake" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: compilar el núcleo
        run: cargo build --release --workspace

      # `flutter build` invoca a CMake, y el CMakeLists de cada plataforma
      # compila y coloca la librería del núcleo junto al ejecutable
      # (app/linux/CMakeLists.txt y app/windows/CMakeLists.txt). Por eso no hay
      # aquí ningún paso de copiar la .so o la .dll a mano.
      - name: compilar la aplicación
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.plataforma }} --release

      # Los motores de borrador viven en el equipo: Sherpa/Vosk cubren Español,
      # Vosk Inglés y Tiny Automático. Los modelos y licencias quedan en el instalador
      # para que la captura y transcripción no dependan de red durante la clase.
      - name: incluir modelos locales de transcripción (Windows)
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: |
          $release = 'app\build\windows\x64\runner\Release'
          & packaging\windows\preparar_vosk.ps1 -ReleaseDir $release

      # ---- Empaquetado -----------------------------------------------------
      - name: paquete .deb
        if: matrix.plataforma == 'linux'
        run: |
          chmod +x packaging/linux/build_deb.sh
          # dpkg exige que la versión empiece por un dígito. Con un tag `v*`
          # sale del tag; en un lanzamiento manual `GITHUB_REF_NAME` es el
          # nombre de la rama («main») y dpkg-deb rechazaba el `control`. Ahí
          # se usa la versión de la app más el sha corto, que además deja
          # distinguir qué commit generó cada paquete.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)
            if [[ -z "$base" ]]; then
              echo "No se pudo leer la versión de app/pubspec.yaml" >&2
              exit 1
            fi
            version="${base}+git${GITHUB_SHA:0:7}"
          fi
          ./packaging/linux/build_deb.sh "$version"

      - name: instalador .exe
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: |
          # Inno Setup viene preinstalado en los runners de Windows.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc packaging\windows\inno_setup.iss

      # Comprueba que la librería del núcleo acabó de verdad junto al .exe. Es
      # el fallo que este workflow tuvo durante meses sin que nadie lo notara:
      # el instalador se generaba igual, y la aplicación arrancaba con datos de
      # demostración porque no encontraba la DLL.
      - name: comprobar que el núcleo va dentro (Windows)
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: |
          $dll = "app\build\windows\x64\runner\Release\dictar_api.dll"
          if (-not (Test-Path $dll)) {
            throw "No se generó ${dll}: el instalador quedaría sin núcleo."
          }
          $release = Split-Path $dll
          foreach ($runtimeDll in @('libvosk.dll', 'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll')) {
            if (-not (Test-Path (Join-Path $release $runtimeDll))) {
              throw "Falta el runtime Vosk requerido: $runtimeDll"
            }
          }
          foreach ($runtimeDll in @('sherpa-onnx-c-api.dll', 'sherpa-onnx-cxx-api.dll', 'onnxruntime.dll', 'onnxruntime_providers_shared.dll')) {
            if (-not (Test-Path (Join-Path $release $runtimeDll))) {
              throw "Falta el runtime Sherpa-ONNX requerido: $runtimeDll"
            }
          }
          $sherpaModel = Join-Path $release 'models\sherpa-onnx-streaming-zipformer-es-kroko-2025-08-06'
          foreach ($modelFile in @('encoder.onnx', 'decoder.onnx', 'joiner.onnx', 'tokens.txt')) {
            if (-not (Test-Path (Join-Path $sherpaModel $modelFile))) {
              throw "Falta el archivo de modelo Sherpa-ONNX: $modelFile"
            }
          }
          if (-not (Test-Path (Join-Path $release 'Sherpa-Spanish-MODEL-ATTRIBUTION.txt'))) {
            throw 'Falta la atribución CC-BY-SA del modelo Sherpa-ONNX.'
          }
          if (-not (Test-Path (Join-Path $release 'models\vosk-model-small-es-0.42\am\final.mdl'))) {
            throw 'Falta el modelo español de Vosk en el paquete Windows.'
          }
          if (-not (Test-Path (Join-Path $release 'models\vosk-model-small-en-us-0.15\am\final.mdl'))) {
            throw 'Falta el modelo inglés de Vosk en el paquete Windows.'
          }
          if (-not (Test-Path (Join-Path $release 'models\ggml-tiny-q5_1.bin'))) {
            throw 'Falta el modelo Whisper Tiny en el paquete Windows.'
          }
          Write-Host "OK: $((Get-Item $dll).Length) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: dictar_ia-${{ matrix.plataforma }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 cubre prácticamente cualquier móvil actual; armeabi-v7a solo
          # hace falta para equipos antiguos. Tiene que coincidir con el ABI
          # que pide app/android/app/build.gradle.kts.
          targets: aarch64-linux-android

      # La clave incluye el NDK porque rust-cache no lo sabe: restauraba un
      # `whisper-rs-sys` compilado meses atrás con otro NDK y ocultaba que con
      # el actual ya no compila. Al cambiar de NDK hay que cambiar esta clave.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ndk-27

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Mismas dependencias que el job de Android de ci.yml: bindgen (vía
      # whisper-rs-sys) necesita libclang, y cmake compila whisper.cpp cruzado.
      - name: dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake ninja-build clang libclang-dev pkg-config

      # `cargo ndk` es quien prepara el enlazador del NDK y los argumentos de
      # clang para bindgen; Gradle lo invoca desde `compilarNucleo`.
      #
      # Se fija el NDK 27 (`ANDROID_NDK_ROOT`, el que trae el runner) y no
      # `ANDROID_NDK_LATEST_HOME`: el NDK 30 rechaza en `sys/cdefs.h` los
      # triples sin nivel de API («Unversioned target triples are not
      # supported!») y whisper-rs-sys, que genera sus bindings con bindgen y
      # compila whisper.cpp con CMake, no llega a compilar. ci.yml no lo
      # sufría solo porque restauraba de la caché un whisper-rs-sys compilado
      # con el NDK 29; en frío fallaba igual.
      - name: cargo-ndk y NDK
        run: |
          cargo install cargo-ndk --locked
          test -d "$ANDROID_NDK_ROOT" || { echo "No existe $ANDROID_NDK_ROOT" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"

      # Mismo paso que en ci.yml, antes de Gradle: si el núcleo no cruza, el
      # fallo sale aquí y no enterrado en la salida de Gradle; y cuando Gradle
      # vuelva a llamar a `cargo ndk` encuentra todo compilado.
      - name: cruzar el núcleo a Android
        run: cargo ndk -t arm64-v8a --platform 26 build --release -p dictar-api

      # Firma de verdad si el repositorio tiene los secretos configurados; si
      # no, Gradle usa la clave de depuración y el APK sirve para probar pero
      # no para publicar. Es deliberado que la ausencia de secretos no rompa el
      # workflow: un fork debe poder construirlo.
      - name: clave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "Sin secretos de firma: Gradle usará la clave de depuración."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/dictar_ia.keystore"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/dictar_ia.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      # Sin `--split-per-abi`: Gradle rechaza combinar los splits con los
      # `abiFilters` de ndk que fija build.gradle.kts, y solo hay un ABI, así
      # que sale un único `app-release.apk`.
      #
      # Mismo control que en Windows: que el núcleo viaje dentro del paquete.
      # Un APK sin la librería nativa se instala, arranca y enseña datos de
      # demostración, que es la peor forma de fallar.
      - name: comprobar que el núcleo va dentro
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          if ! unzip -l "$apk" | grep -q "lib/arm64-v8a/libdictar_api.so"; then
            echo "El APK no lleva libdictar_api.so: se instalaría sin núcleo." >&2
            unzip -l "$apk" | grep "lib/" || true
            exit 1
          fi
          echo "OK: $apk lleva el núcleo"

      - uses: actions/upload-artifact@v7
        with:
          name: dictar_ia-android
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
