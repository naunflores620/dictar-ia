name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# El .exe de Windows NO se puede construir desde Linux: Flutter necesita MSVC y
# el SDK de Windows, y no hay atajo fiable. De ahí la matriz: cada plataforma se
# compila en su propio runner.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            plataforma: linux
          - os: windows-latest
            plataforma: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: dependencias del sistema (Linux)
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-dev pkg-config \
            libgtk-3-dev liblzma-dev \
            libpipewire-0.3-dev libasound2-dev libsecret-1-dev

      - name: compilar el núcleo
        run: cargo build --release --workspace

      - name: compilar la aplicación
        working-directory: app
        run: |
          flutter pub get
          flutter build ${{ matrix.plataforma }} --release

      # ---- Empaquetado -----------------------------------------------------
      - name: paquete .deb
        if: matrix.plataforma == 'linux'
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh "${GITHUB_REF_NAME#v}"

      - name: instalador .exe
        if: matrix.plataforma == 'windows'
        shell: pwsh
        run: |
          # Inno Setup viene preinstalado en los runners de Windows.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc packaging\windows\inno_setup.iss

      - uses: actions/upload-artifact@v4
        with:
          name: dictar_ia-${{ matrix.plataforma }}
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 cubre prácticamente cualquier móvil actual; armeabi-v7a solo
          # hace falta para equipos antiguos.
          targets: aarch64-linux-android
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dictar_ia-android
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
