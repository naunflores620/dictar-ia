[package]
name = "dictar-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dictar-domain = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hound = "3.5"
rubato = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8"
libspa = "0.8"

# 0.58 y no otra: es la que ya fija `Cargo.lock` (entra transitivamente por
# `xcap`, en `core/screen-capture`), así que no añade una segunda versión del
# crate al árbol de dependencias.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"
